name: Check & Update R Dependencies

on:
  schedule:
    # Runs every Monday at 8 AM UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  update-deps:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Setup renv
        uses: r-lib/actions/setup-renv@v2

      - name: Update packages and sync DESCRIPTION
        shell: Rscript {0}
        run: |
          # 1. Update installed packages to their latest versions
          renv::update(prompt = FALSE)
      
          # 2. Install missing packages required for attachment analysis
          renv::install(c("attachment", "actilifecounts", "testthat"), prompt = FALSE)
      
          # 3. Sync imported packages into DESCRIPTION
          attachment::att_amend_desc(document = FALSE)
      
          # 4. Set renv to explicit mode so it ONLY snapshots packages listed in DESCRIPTION
          renv::settings$snapshot.type("explicit")

          # 5. Snapshot updated state into renv.lock
          renv::snapshot(prompt = FALSE)

      - name: Create Pull Request if files changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update dependencies in DESCRIPTION and renv.lock"
          title: "Automated R Dependency Update"
          body: |
            Automated PR generated by GitHub Actions.
            
            - Updated package versions in `renv.lock`
            - Synchronized dependency requirements in `DESCRIPTION`
          branch: "automated-dep-update"
          delete-branch: true